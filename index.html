<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate & Fun Wheel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4 selection:bg-purple-500 selection:text-white">

    <!-- Header -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-3xl font-extrabold bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 bg-clip-text text-transparent">
            Fate & Fun Wheel
        </h1>
        <p id="step-indicator" class="text-slate-400 text-sm mt-1">ধাপ ১/৫: রঙের খেলা</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col items-center">
        
        <!-- Wheel Title -->
        <h2 id="wheel-title" class="text-xl font-bold mb-4 text-purple-300 text-center">🎨 Color Palette</h2>

        <!-- Wheel Wrapper -->
        <div class="relative flex flex-col items-center my-2">
            <!-- Top Pointer Arrow -->
            <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-b-[24px] border-b-red-500 z-20 mb-[-10px] filter drop-shadow"></div>
            
            <!-- Canvas -->
            <canvas id="wheelCanvas" width="300" height="300" class="rounded-full border-4 border-slate-700 shadow-inner bg-slate-800"></canvas>
        </div>

        <!-- Result Display -->
        <div id="result-box" class="h-12 flex items-center justify-center my-3">
            <span id="result-text" class="text-lg font-semibold text-emerald-400"></span>
        </div>

        <!-- Spin Button -->
        <button id="spin-btn" onclick="startSpin()" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 font-bold rounded-xl shadow-lg transition transform active:scale-95 cursor-pointer">
            স্পিন করুন! 🎡
        </button>

        <!-- Next Wheel Button (Hidden initially) -->
        <button id="next-btn" onclick="nextWheel()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl shadow-lg transition hidden mt-3">
            পরবর্তী হুইল ➡️
        </button>
    </main>

    <!-- Summary Modal (Hidden initially) -->
    <div id="summary-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl text-center">
            <h3 class="text-2xl font-bold text-pink-400 mb-4">🎉 আপনার ভাগ্যের ফলাফল!</h3>
            <div id="summary-content" class="space-y-3 text-left bg-slate-950 p-4 rounded-xl border border-slate-800 mb-6 text-sm">
                <!-- Summary items injected via JS -->
            </div>
            <button onclick="resetAll()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 font-bold rounded-xl shadow-lg hover:opacity-90 transition">
                আবার খেলুন 🔄
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-slate-400 text-xs py-4 text-center">
        ওয়েবসাইট ক্রিয়েটেড বাই নিলয় দাস
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const wheelsData = [
            {
                title: "🎨 Color Palette (রঙের খেলা)",
                stepText: "ধাপ ১/৫: রঙের খেলা",
                segments: ["লাল", "নীল", "সবুজ", "হলুদ"],
                colors: ["#EF4444", "#3B82F6", "#10B981", "#F59E0B"]
            },
            {
                title: "📋 Master Plan (কর্মপরিকল্পনা)",
                stepText: "ধাপ ২/৫: প্ল্যান সিলেকশন",
                segments: ["প্ল্যান এ", "প্ল্যান বি", "প্ল্যান সি", "প্ল্যান ডি"],
                colors: ["#8B5CF6", "#EC4899", "#06B6D4", "#F97316"]
            },
            {
                title: "🔀 Lucky Choice (পছন্দ নির্বাচন)",
                stepText: "ধাপ ৩/৫: চয়েস সিলেকশন",
                segments: ["চয়েস ১", "চয়েস ২", "চয়েস ৩", "চয়েস ৪", "চয়েস ৫", "চয়েস ৬"],
                colors: ["#3B82F6", "#10B981", "#F59E0B", "#EF4444", "#8B5CF6", "#EC4899"]
            },
            {
                title: "💍 Future Queen (ভবিষ্যৎ স্ত্রীর আদ্যক্ষর)",
                stepText: "ধাপ ৪/৫: নামের প্রথম অক্ষর",
                segments: ["A", "B", "C", "D", "E", "F", "G", "H", "M", "N", "P", "R", "S", "T"],
                colors: ["#F43F5E", "#3B82F6", "#10B981", "#F59E0B", "#8B5CF6", "#EC4899", "#06B6D4", "#84CC16", "#Eab308", "#A855F7", "#14B8A6", "#F97316", "#6366F1", "#475569"]
            },
            {
                title: "🎭 Inner Personality (তোমার ভেতরের রূপ)",
                stepText: "ধাপ ৫/৫: চরিত্র ও বৈশিষ্ট্য",
                segments: ["স্মার্ট", "ভালো", "বুদ্ধিমতী", "গবোদ্ধ", "খারাপ", "পাগল", "আলসে"],
                colors: ["#10B981", "#3B82F6", "#8B5CF6", "#F59E0B", "#EF4444", "#EC4899", "#64748B"]
            }
        ];

        let currentWheelIndex = 0;
        let userResults = [];
        let currentAngle = 0;
        let isSpinning = false;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const wheelTitle = document.getElementById('wheel-title');
        const stepIndicator = document.getElementById('step-indicator');
        const resultText = document.getElementById('result-text');
        const spinBtn = document.getElementById('spin-btn');
        const nextBtn = document.getElementById('next-btn');

        function drawWheel() {
            const current = wheelsData[currentWheelIndex];
            const segments = current.segments;
            const colors = current.colors;
            const sliceAngle = (2 * Math.PI) / segments.length;

            ctx.clearRect(0, 0, 300, 300);

            segments.forEach((segment, i) => {
                const angle = i * sliceAngle + currentAngle;
                
                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 145, angle, angle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(150, 150);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px "Hind Siliguri", sans-serif';
                ctx.fillText(segment, 125, 5);
                ctx.restore();
            });

            // Center Pin Circle
            ctx.beginPath();
            ctx.arc(150, 150, 18, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#334155';
            ctx.stroke();
        }

        // Initialize first wheel
        drawWheel();

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
            resultText.innerText = "ঘুরছে...";
            nextBtn.classList.add('hidden');

            const current = wheelsData[currentWheelIndex];
            const segments = current.segments;
            const sliceAngle = (2 * Math.PI) / segments.length;

            // Random spin amount (between 5 to 8 full rotations + extra random angle)
            const randomSpins = Math.floor(Math.random() * 4) + 5;
            const extraAngle = Math.random() * (2 * Math.PI);
            const totalSpinAngle = (randomSpins * 2 * Math.PI) + extraAngle;

            let startTime = null;
            const duration = 3500; // 3.5 seconds

            function animate(currentTime) {
                if (!startTime) startTime = currentTime;
                let progress = (currentTime - startTime) / duration;

                if (progress < 1) {
                    // Ease out cubic effect for smooth stopping
                    let easeProgress = 1 - Math.pow(1 - progress, 3);
                    currentAngle = totalSpinAngle * easeProgress;
                    drawWheel();
                    requestAnimationFrame(animate);
                } else {
                    currentAngle = totalSpinAngle;
                    drawWheel();
                    isSpinning = false;
                    spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                    // Calculate winning index based on Top-Center pointer (angle 3 * PI / 2)
                    const normalizedAngle = (currentAngle) % (2 * Math.PI);
                    const pointerOffset = (1.5 * Math.PI - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
                    const winningIndex = Math.floor(pointerOffset / sliceAngle) % segments.length;
                    
                    const winner = segments[winningIndex];
                    resultText.innerText = `ফলাফল: ${winner}`;
                    userResults[currentWheelIndex] = { title: current.title.split(' ')[1], value: winner };

                    // Trigger confetti celebration
                    confetti({
                        particleCount: 80,
                        spread: 60,
                        origin: { y: 0.6 }
                    });

                    // Show next button or summary
                    if (currentWheelIndex < wheelsData.length - 1) {
                        nextBtn.classList.remove('hidden');
                    } else {
                        setTimeout(showSummary, 1500);
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        function nextWheel() {
            if (currentWheelIndex < wheelsData.length - 1) {
                currentWheelIndex++;
                const current = wheelsData[currentWheelIndex];
                wheelTitle.innerText = current.title;
                stepIndicator.innerText = current.stepText;
                resultText.innerText = "";
                nextBtn.classList.add('hidden');
                currentAngle = 0;
                drawWheel();
            }
        }

        function showSummary() {
            const summaryContent = document.getElementById('summary-content');
            summaryContent.innerHTML = userResults.map((item, idx) => `
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-400">হুইল ${idx + 1} (${item.title}):</span>
                    <span class="font-bold text-pink-400">${item.value}</span>
                </div>
            `).join('');
            document.getElementById('summary-modal').classList.remove('hidden');
            document.getElementById('summary-modal').classList.add('flex');
        }

        function resetAll() {
            currentWheelIndex = 0;
            userResults = [];
            currentAngle = 0;
            document.getElementById('summary-modal').classList.add('hidden');
            document.getElementById('summary-modal').classList.remove('flex');
            const current = wheelsData[currentWheelIndex];
            wheelTitle.innerText = current.title;
            stepIndicator.innerText = current.stepText;
            resultText.innerText = "";
            nextBtn.classList.add('hidden');
            drawWheel();
        }
    </script>
</body>
  </html>
